<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; padding: 40px 0; margin-bottom: 30px; border-radius: 0 0 15px 15px; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1>🏋️‍♂️ FitBuddy</h1>
        <p class="lead">Your AI-Powered Workout & Diet Planner</p>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="mb-4 text-center">Enter Your Details</h3>
                    <form action="/generate" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Age</label>
                                <input type="number" name="age" class="form-control" placeholder="25" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Gender</label>
                                <select name="gender" class="form-select" required>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fitness Goal</label>
                            <select name="fitness_goal" class="form-select" required>
                                <option value="Weight Loss">Weight Loss</option>
                                <option value="Muscle Gain">Muscle Gain</option>
                                <option value="Endurance">Endurance & Cardio</option>
                                <option value="General Fitness">General Fitness</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Experience Level</label>
                            <select name="experience_level" class="form-select" required>
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dietary Preference</label>
                            <select name="dietary_preference" class="form-select" required>
                                <option value="Non-Vegetarian">Non-Vegetarian</option>
                                <option value="Vegetarian">Vegetarian</option>
                                <option value="Vegan">Vegan</option>
                                <option value="High Protein">High Protein</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">Generate My Plan 🚀</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/users" class="text-muted">View Previous Plans</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
